<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Fenaki preview</title><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<div id="root" class="sx-pad" style="display:grid;gap:24px;max-width:880px"></div>
<script>
var S = window.Fenaki, h = React.createElement;
var SHORTS = [
  { title: 'Timecode', director: 'Juanjo Giménez', year: 2016, seconds: 900, tone: 'tungsteno', badges: [{ label: 'Sub ES', tone: 'info' }] },
  { title: 'Cuerdas', director: 'Pedro Solís García', year: 2013, seconds: 660, tone: 'sala', badges: [{ label: 'Animación' }] },
  { title: 'Madre', director: 'Rodrigo Sorogoyen', year: 2017, seconds: 1080, tone: 'plata' },
  { title: 'Alike', director: 'Daniel Martínez Lara y Rafa Cano Méndez', year: 2015, seconds: 480, tone: 'sala', badges: [{ label: 'Sin diálogos' }] },
  { title: '7:35 de la mañana', director: 'Nacho Vigalondo', year: 2003, seconds: 480, tone: 'tungsteno' },
  { title: 'Aquel no era yo', director: 'Esteban Crespo', year: 2012, seconds: 1440, tone: 'plata', badges: [{ label: 'Nuevo', tone: 'accent' }] }
];
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(S.PlayerGate, { title: 'Timecode', message: 'Este corto se reproduce desde YouTube. Al darle a reproducir, YouTube puede guardar cookies en tu navegador.', playLabel: 'Ver ahora', moreLabel: 'Más sobre las cookies', loadedLabel: 'Aquí se carga el reproductor de YouTube' }),
  h('div', { className: 'sx-row' }, h(S.Duration, { seconds: 900 }), h(S.Badge, null, 'Ficción'), h(S.Badge, { tone: 'info' }, 'Sub ES'), h('span', { style: { color: 'var(--ink-muted)', fontSize: 13 } }, 'España · 2016')),
  h('p', { style: { margin: 0, fontSize: 17, lineHeight: '26px', maxWidth: '62ch' } }, 'Luna y Diego son los vigilantes de un aparcamiento. Ella trabaja de día y él de noche, y solo se cruzan en el cambio de turno.'),
  h('p', { style: { margin: 0, color: 'var(--ink-muted)' } }, 'Dirigido por Juanjo Giménez'),
  h('div', { className: 'sx-row' }, h(S.Button, { variant: 'secondary', icon: 'plus' }, 'Añadir a mi lista')),
  h(S.LicenseNote, { route: 'embed', routeLabel: 'Embed oficial' }, 'Se reproduce desde el canal de YouTube de su productora. Fenaki no aloja ni modifica el vídeo.'),
  h(S.Rail, { title: 'Si te ha gustado', actionLabel: 'Ver todo' }, SHORTS.slice(1).map(function (s, i) { return h(S.ShortCard, Object.assign({ key: i, href: '#' }, s)); }))
));
</script>
</body>
</html>
