# SSH on the production server (installed by bootstrap.sh as /etc/ssh/sshd_config.d/00-fenaki.conf;
# the local rehearsal's stand-in uses it too). Public keys only, one user, modern algorithms.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AllowUsers ubuntu

# Ed25519 keys (plain or on a hardware security key), and RSA keys of at least 3072 bits with
# SHA-2 signatures only (never ssh-rsa, which signs with SHA-1).
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256
RequiredRSASize 3072
HostKeyAlgorithms ssh-ed25519
# OpenSSH clients pick the first ones. Kamal's SSH library (net-ssh 7.3, in its official image)
# has no curve25519: it negotiates ecdh-sha2-nistp256, the last one.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
