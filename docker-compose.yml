# Local development services. Not used in production (Kamal manages those).
name: shortix

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: shortix
      POSTGRES_PASSWORD: shortix
      POSTGRES_DB: shortix
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortix -d shortix']
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: shortix-dev-master-key-change-me
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  meilisearch-data:
